# EPI EPI LEDs presets all set the same property (EPI LED Selector / Physical Shutter 1) to
# EPI a different LED label. The selector only records which LED the channel uses: it never
# EPI opens or closes anything, and the app never opens it. The app lights the LED itself
# EPI (percent first, then the shutter API) for Snap/Live/MDA. Do not open EPI LED Selector
# EPI by hand: it would open the selected LED at its cached intensity. Presets never touch
# EPI an LED, Core Shutter or LED Intensity(%) (the LED State strings are Open / Closed).
